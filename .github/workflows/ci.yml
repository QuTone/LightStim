name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - pauli-backend: reference
            tracker-backend: reference
          - pauli-backend: native
            tracker-backend: reference
          - pauli-backend: native
            tracker-backend: persistent
    env:
      LIGHTSTIM_PAULI_BACKEND: ${{ matrix.pauli-backend }}
      LIGHTSTIM_TRACKER_BACKEND: ${{ matrix.tracker-backend }}
      LIGHTSTIM_BUILD_JOBS: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install dependencies
        run: |
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m pip install -e .
          venv/bin/python -m pip install pytest pytest-timeout httpx==0.28.1

      - name: Run tests
        run: venv/bin/python -m pytest tests/ -m "not slow" --timeout=90 -q

  required-test:
    # Keep the stable check name required by the main branch ruleset while
    # requiring every backend configuration in the matrix above to succeed.
    name: test
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all backend test configurations
        run: test "${{ needs.test.result }}" = success
