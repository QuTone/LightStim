[project.optional-dependencies]
plot = [
    "matplotlib",
    "seaborn",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
decoders = [
    "stimbposd",                # BP+OSD
    "mwpf",                     # MWPF
    "frozendict",
    "frozenlist",
    "relay-bp[stim]",           # Relay-BP
    # Tesseract (beam-search MLE). A prebuilt wheel may not match every CPU;
    # build it from source if it fails to import.
    "tesseract-decoder",
    "ldpc",                     # Plain BP (ldpc-bp)
    # The exact-MLE decoder (mle-ilp) uses the core scipy dependency.
]
gpu = [
    "cudaq-qec",
]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
    "matplotlib",
    "seaborn",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
# Wheel-only packages must publish a Python 3.11 linux wheel. Later
# tesseract-decoder builds are 3.12+ only.
required-environments = [
    "python_version == '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Rebuild the C++ extensions (setup.py) when their sources change, not only
# when the project metadata does.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "lightstim/**/*.cc" },
    { file = "lightstim/**/*.cpp" },
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lightstim*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring a CUDA device",
]
